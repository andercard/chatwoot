type: object
properties:
  id:
    type: integer
    description: ID of the canned response
  account_id:
    type: integer
    description: Account Id
  short_code:
    type: string
    description: Short Code for quick access of the canned response
  content:
    type: string
    description: Message content for canned response
  created_at:
    type: string
    description: The date and time when the canned response was created
  updated_at:
    type: string
    description: The date and time when the canned response was updated
  files:
    type: array
    description: Files attached to the canned response
    items:
      type: object
      properties:
        id:
          type: integer
          description: ID of the attachment
        blob_id:
          type: integer
          description: ID of the stored file
        signed_id:
          type: string
          description: Signed ID of the stored file
        filename:
          type: string
          description: Name of the file
        content_type:
          type: string
          description: MIME type of the file
        byte_size:
          type: integer
          description: Size of the file in bytes
        file_type:
          type: string
          enum: [image, video, document]
          description: Kind of file
        file_url:
          type: string
          description: Stable URL that redirects to the file
