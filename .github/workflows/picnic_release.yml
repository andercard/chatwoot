# Picnic Art release image: pushing a tag vX.Y.Z-picnic.N builds linux/amd64 and publishes
# andercard/chatwoot:<tag> to Docker Hub. The server only pulls it (it has no RAM to build).
# Secret needed (Settings > Secrets and variables > Actions): DOCKERHUB_TOKEN (a Docker Hub access token).
name: Picnic release image

on:
  push:
    tags:
      - 'v*-picnic.*'

permissions:
  contents: read

concurrency:
  group: picnic-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: andercard/chatwoot

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate tag name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-picnic\.[0-9]+$ ]] || { echo "Tag must look like v4.17.1-picnic.1"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      # Internal docs/scripts never go into the public image.
      - name: Remove internal folder from the build context
        run: rm -rf picnicart

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: andercard
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags are immutable: never overwrite an image that was already released.
      - name: Fail if the image tag already exists
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo "$IMAGE:$TAG already exists; create a new tag (picnic.N+1)"; exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: PICNIC_RELEASE=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
